<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Microsoft YaHei","SimHei",sans-serif}

/* ========== 序幕 ========== */
#intro{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;transition:opacity 1.5s}
#intro.hide{opacity:0;pointer-events:none}
#introVideo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
#meteorCvs{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
.intro-ui{position:relative;z-index:2;text-align:center;opacity:0;transition:opacity 2.5s}
.intro-ui.show{opacity:1}
.reveal-line{margin-bottom:18px;min-height:1.6em}
.reveal-line .ch{display:inline-block;opacity:0;transform:translateY(10px) scale(.95);transition:opacity .9s ease,transform .9s ease}
.reveal-line .ch.vis{opacity:1;transform:translateY(0) scale(1)}
.line1 .ch{font-size:30px;font-weight:700;color:rgba(255,255,255,.82);letter-spacing:3px;text-shadow:0 0 24px rgba(160,200,255,.4)}
.line2 .ch{font-size:24px;font-weight:400;color:rgba(255,255,255,.6);letter-spacing:3px;text-shadow:0 0 18px rgba(180,160,255,.3)}
.intro-ui h2{font-size:36px;color:rgba(255,255,255,.82);letter-spacing:8px;margin:24px 0 12px;text-shadow:0 0 20px rgba(160,190,255,.5)}
.intro-ui p{font-size:15px;color:rgba(255,255,255,.4);letter-spacing:3px;margin-bottom:36px}
.pwd-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
#pwdIn{width:210px;height:52px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;font-size:30px;text-align:center;letter-spacing:14px;outline:none;transition:border-color .3s,box-shadow .3s}
#pwdIn:focus{border-color:rgba(130,170,255,.6);box-shadow:0 0 20px rgba(130,170,255,.2)}
#pwdIn::placeholder{color:rgba(255,255,255,.2);letter-spacing:4px;font-size:15px}
#enterBtn{padding:9px 44px;font-size:15px;letter-spacing:4px;color:#fff;background:0 0;border:1px solid rgba(255,255,255,.25);border-radius:24px;cursor:pointer;transition:background .3s}
#enterBtn:hover{background:rgba(255,255,255,.1)}
#errMsg{font-size:13px;color:#ff6b6b;letter-spacing:2px;height:18px;opacity:0;transition:opacity .3s}
#errMsg.show{opacity:1}

/* ========== 生日揭晓页 ========== */
#revealPage{position:fixed;inset:0;z-index:998;background:#0a0520;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity 1.5s}
#revealPage.show{display:flex}
#revealPage.hide{opacity:0;pointer-events:none}
canvas#revealCvs{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.reveal-content{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center}
.reveal-text{font-size:38px;font-weight:700;color:#fff;letter-spacing:6px;opacity:0;transform:translateY(30px);transition:opacity 2s ease,transform 2s ease;text-shadow:0 0 30px rgba(255,180,220,.5),0 0 60px rgba(255,100,180,.25);margin-bottom:10px}
.reveal-text.vis{opacity:1;transform:translateY(0)}
.reveal-arrow{font-size:64px;color:rgba(255,255,255,.7);opacity:0;transition:opacity 1.5s ease .5s;animation:none;margin-bottom:16px}
.reveal-arrow.vis{opacity:1;animation:bounce 1.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
.reveal-photo{width:min(420px,75vw);border-radius:18px;opacity:0;transform:scale(.85);transition:opacity 2.5s ease,transform 2.5s ease;box-shadow:0 0 40px rgba(255,150,200,.3),0 8px 40px rgba(0,0,0,.6);border:3px solid rgba(255,255,255,.15)}
.reveal-photo.vis{opacity:1;transform:scale(1)}
.danmaku{position:absolute;white-space:nowrap;font-size:22px;font-weight:700;letter-spacing:3px;opacity:.85;z-index:1;pointer-events:none;text-shadow:0 0 12px rgba(255,100,180,.4)}
@keyframes danmakuMove{from{transform:translateX(110vw)}to{transform:translateX(-100%)}}
.falling-cake{position:absolute;font-size:36px;z-index:1;pointer-events:none;animation:cakeFall linear forwards}
@keyframes cakeFall{from{transform:translateY(-60px) rotate(0deg);opacity:0}10%{opacity:1}to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
.reveal-next-btn{position:relative;z-index:10;margin-top:28px;padding:12px 52px;font-size:17px;letter-spacing:5px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:30px;cursor:pointer;opacity:0;transition:opacity 1.5s ease,background .3s}
.reveal-next-btn.vis{opacity:1}
.reveal-next-btn:hover{background:rgba(255,100,180,.2);border-color:rgba(255,150,200,.5)}

/* ========== 回顾页 ========== */
#memoryPage{position:fixed;inset:0;z-index:997;background:#080318;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity 1.5s}
#memoryPage.show{display:flex}
#memoryPage.hide{opacity:0;pointer-events:none}
canvas#memCvs{position:absolute;inset:0;width:100%;height:100%;z-index:0}

.mem-text{
  position:relative;z-index:2;font-size:32px;font-weight:700;color:rgba(255,255,255,.88);
  letter-spacing:5px;text-align:center;
  text-shadow:0 0 24px rgba(180,160,255,.4),0 0 48px rgba(160,120,255,.2);
  opacity:0;transform:translateY(20px);transition:opacity 2s ease,transform 2s ease;
  margin-bottom:0;
}
.mem-text.vis{opacity:1;transform:translateY(0)}

.mem-review-btn{
  position:relative;z-index:2;margin-top:16px;padding:10px 48px;font-size:16px;
  letter-spacing:5px;color:#fff;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.25);border-radius:30px;cursor:pointer;
  opacity:0;transition:opacity 1.5s ease,background .3s,transform .2s;
}
.mem-review-btn.vis{opacity:1}
.mem-review-btn:hover{background:rgba(130,110,255,.2);border-color:rgba(160,140,255,.5);transform:scale(1.04)}

/* 照片容器 */
.mem-photo-area{
  position:relative;z-index:2;width:90vw;height:80vh;
  margin-top:4px;overflow:visible;
}

/* 单张照片展示 */
.mem-photo-single{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(0);
  border-radius:14px;box-shadow:0 0 30px rgba(200,160,255,.3),0 6px 30px rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.15);
  transition:transform 1.2s cubic-bezier(.23,1,.32,1),opacity 1.2s ease;
  object-fit:contain;
  background:rgba(0,0,0,.4);
}
.mem-photo-single.show{transform:translate(-50%,-50%) scale(1)}
.mem-photo-single.shrink{transition:transform 1.2s cubic-bezier(.23,1,.32,1),opacity 1.2s ease,opacity .8s ease .4s}

/* S形最终位置 */
.mem-photo-s{
  position:absolute;border-radius:10px;
  box-shadow:0 0 20px rgba(200,160,255,.3),0 4px 20px rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.15);
  transition:all 1.6s cubic-bezier(.23,1,.32,1);
  object-fit:contain;
  background:rgba(0,0,0,.4);
}

.mem-enter-btn{
  position:relative;z-index:2;margin-top:24px;padding:12px 52px;font-size:17px;
  letter-spacing:5px;color:#fff;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.25);border-radius:30px;cursor:pointer;
  opacity:0;transition:opacity 1.2s ease,background .3s;
}
.mem-enter-btn.vis{opacity:1}
.mem-enter-btn:hover{background:rgba(255,100,180,.2);border-color:rgba(255,150,200,.5)}

.mem-final-text{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  z-index:200;font-size:42px;font-weight:700;color:#fff;letter-spacing:6px;
  text-shadow:0 0 30px rgba(255,180,220,.6),0 0 60px rgba(255,100,180,.3);
  opacity:0;transition:opacity 2s ease,transform 2s ease;
  text-align:center;white-space:nowrap;
}
.mem-final-text.vis{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ========== 主站 ========== */
#mainSite{display:none;width:100%;height:100%}
#mainSite.on{display:block}
.nav{position:fixed;top:0;left:0;width:100%;z-index:100;display:flex;justify-content:center;gap:40px;padding:18px 0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.nav a{color:#fff;text-decoration:none;font-size:18px;letter-spacing:2px;padding:6px 18px;border-radius:20px;transition:background .3s,transform .2s}
.nav a:hover{background:rgba(255,255,255,.15);transform:scale(1.08)}
.nav a.active{background:rgba(255,100,100,.4);font-weight:bold}
canvas#fwCvs{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100%}
.content .title{position:relative}
.title{display:flex;gap:12px;margin-top:40px}
.title span{font-size:72px;font-weight:900;text-shadow:0 0 20px rgba(255,255,255,.5),0 0 40px rgba(255,255,255,.25);animation:glow 2s ease-in-out infinite alternate}
.title span:nth-child(1){color:#ff4d6a}
.title span:nth-child(2){color:#ffb84d}
.title span:nth-child(3){color:#4dff91}
.title span:nth-child(4){color:#4dc8ff}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.4);text-shadow:0 0 30px currentColor,0 0 60px currentColor}}
.char-bounce{position:absolute;font-size:160px;font-weight:900;opacity:0;pointer-events:none;display:inline-block;background:linear-gradient(135deg,#ff4d6a,#ffb84d,#4dff91,#4dc8ff,#c24dff,#ff4daa);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:rainbow 1.5s linear infinite;filter:drop-shadow(0 0 18px rgba(255,255,255,.4));transition:none;z-index:50}
@keyframes rainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.char-bounce.bouncing{opacity:1}
.char-bounce.settled{opacity:1;position:fixed!important;transition:left 1.4s cubic-bezier(.23,1,.32,1),top 1.4s cubic-bezier(.23,1,.32,1),transform 1.4s cubic-bezier(.23,1,.32,1)}
.page-indicator{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:100}
.page-indicator span{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s}
.page-indicator span.active{background:#ff4d6a}

/* 神秘仪式入口按钮 */
.mystery-btn{
  margin-top:24px;padding:14px 44px;font-size:18px;letter-spacing:4px;color:#fff;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);
  border-radius:30px;cursor:pointer;transition:background .3s,transform .2s;
  position:relative;z-index:2;
}
.mystery-btn:hover{background:rgba(255,180,220,.2);border-color:rgba(255,150,200,.5);transform:scale(1.05)}

/* ========== 生日蛋糕仪式页 ========== */
#cakeCeremony{position:fixed;inset:0;z-index:150;background:#0a0520;display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;padding-top:20px}
#cakeCeremony.show{display:flex}
#cakeCeremony.hide{opacity:0;pointer-events:none;transition:opacity 1.5s}
canvas#cakeCvs{position:absolute;inset:0;width:100%;height:100%;z-index:0}

/* 蛋糕容器 - 立体透视 */
.cake-scene{
  position:relative;z-index:2;
  perspective:1000px;
  margin-top:0;
}
.cake-wrapper{
  transform:rotateX(8deg);
  transform-origin:center bottom;
  position:relative;
  display:flex;flex-direction:column;align-items:center;
}

/* 蛋糕图片容器 */
.cake-img-wrap{
  position:relative;z-index:2;
  width:min(620px,88vw);
}
.cake-img-wrap img{
  width:100%;height:auto;display:block;
  border-radius:12px;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,.35));
}

/* 蜡烛容器 - 覆盖在蛋糕图片顶部 */
.candle-area{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:5;pointer-events:none;
}

/* 蜡烛 */
.candle{
  position:absolute;
  width:10px;height:56px;
  background:linear-gradient(180deg,#fff8dc 0%,#ffe066 20%,#ffb347 60%,#ff8c00 100%);
  border-radius:4px 4px 2px 2px;
  box-shadow:0 2px 8px rgba(255,140,0,.25),inset 2px 0 4px rgba(255,255,255,.4),inset -2px 0 4px rgba(255,140,0,.15);
  transform-origin:bottom center;
}
.candle::before{
  content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);
  width:14px;height:6px;background:#ffe066;border-radius:50%;
  box-shadow:0 0 4px rgba(255,200,50,.3);
}
.candle-stripe{
  position:absolute;width:100%;height:6px;
  background:rgba(255,255,255,.4);border-radius:2px;
}

/* 火焰 */
.flame{
  position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  width:12px;height:22px;
  background:radial-gradient(ellipse at center bottom,#fff 0%,#ffdd57 25%,#ff9500 55%,#ff4500 100%);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  opacity:0;transition:opacity .3s;
  animation:flicker .15s ease-in-out infinite alternate;
}
.flame.lit{opacity:1}
@keyframes flicker{0%{transform:translateX(-50%) scale(1) rotate(-2deg)}100%{transform:translateX(-50%) scale(1.1) rotate(2deg)}}

.flame-glow{
  position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,50,.45) 0%,transparent 70%);
  opacity:0;transition:opacity .3s;
}
.flame-glow.lit{opacity:1}

/* 火柴 */
.match{
  position:absolute;z-index:10;
  width:6px;height:70px;
  background:linear-gradient(180deg,#8B4513,#A0522D);
  border-radius:2px;opacity:0;
  transition:opacity .3s;
}
.match-head{
  position:absolute;top:-8px;left:-4px;width:14px;height:14px;
  background:radial-gradient(circle,#ff6600,#cc3300);
  border-radius:50%;
  box-shadow:0 0 12px #ff6600;
}
.match.lit .match-head{
  background:radial-gradient(circle,#fff,#ffdd57,#ff6600);
  box-shadow:0 0 20px #ffaa00,0 0 40px #ff6600;
}

/* 祝福文字 - 在蛋糕下方 */
.cake-text{
  position:relative;z-index:20;font-size:32px;font-weight:700;color:#fff;letter-spacing:5px;
  text-shadow:0 0 24px rgba(255,180,220,.5),0 0 48px rgba(255,100,180,.25);
  opacity:0;transition:opacity 1.5s ease,transform 1.5s ease;
  text-align:center;white-space:nowrap;
  transform:translateY(15px);margin-top:14px;
}
.cake-text.vis{opacity:1;transform:translateY(0)}

/* 许愿按钮 - 在蛋糕下方 */
.wish-btn{
  position:relative;z-index:30;margin-top:16px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ff4d6a,#cc0033);
  border:3px solid rgba(255,255,255,.3);
  color:#fff;font-size:28px;font-weight:700;letter-spacing:4px;
  cursor:pointer;opacity:0;transition:opacity 1s ease,transform .2s;
  box-shadow:0 0 30px rgba(255,50,80,.4),0 8px 30px rgba(0,0,0,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.4;
}
.wish-btn.vis{opacity:1}
.wish-btn:hover{transform:scale(1.08)}
.wish-btn .wish-hint{font-size:12px;font-weight:400;letter-spacing:1px;opacity:.7;margin-top:4px}

/* 吹灭按钮 - 在蛋糕下方 */
.blow-btn{
  position:relative;z-index:30;margin-top:14px;padding:14px 48px;font-size:17px;letter-spacing:4px;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);
  border-radius:30px;cursor:pointer;opacity:0;transition:opacity 1s ease,background .3s;
}
.blow-btn.vis{opacity:1}
.blow-btn:hover{background:rgba(100,180,255,.2);border-color:rgba(100,180,255,.5)}

/* 蛋糕仪式页掉落蛋糕emoji */
.falling-cake-emoji{
  position:fixed;z-index:1;pointer-events:none;
  font-size:36px;
  animation:cakeEmojiFall linear forwards;
}
@keyframes cakeEmojiFall{
  0%{transform:translateY(-60px) rotate(0deg);opacity:0}
  8%{opacity:.9}
  100%{transform:translateY(110vh) rotate(360deg);opacity:.7}
}

/* 风效果 - 横扫大风 */
.wind-sweep{
  position:fixed;left:0;top:0;width:100%;height:100%;z-index:15;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(180,220,255,.0) 10%,rgba(180,220,255,.12) 30%,rgba(200,230,255,.18) 50%,rgba(180,220,255,.12) 70%,rgba(180,220,255,.0) 90%,transparent 100%);
  opacity:0;transform:translateX(-100%);
}
.wind-sweep.blowing{animation:sweepWind 1.2s ease-out forwards}
@keyframes sweepWind{
  0%{opacity:0;transform:translateX(-100%)}
  15%{opacity:1}
  85%{opacity:1}
  100%{opacity:0;transform:translateX(100%)}
}

/* 风粒子 */
.wind-particle{
  position:fixed;z-index:16;pointer-events:none;
  width:3px;height:3px;border-radius:50%;
  background:rgba(200,230,255,.6);
  opacity:0;
}
.wind-particle.blowing{animation:windPart .8s ease-out forwards}
@keyframes windPart{
  0%{opacity:0;transform:translateX(0)}
  20%{opacity:.8}
  100%{opacity:0;transform:translateX(100vw)}
}

/* 最终祝福 - 在蛋糕下方 */
.final-blessing{
  position:relative;z-index:200;font-size:52px;font-weight:900;letter-spacing:6px;
  text-align:center;line-height:1.5;
  opacity:0;transition:opacity 2s ease,transform 2s cubic-bezier(.23,1,.32,1);
  background:linear-gradient(135deg,#ff4d6a,#ffb84d,#4dff91,#4dc8ff,#c24dff,#ff4daa);
  background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:rainbow 2s linear infinite;
  filter:drop-shadow(0 0 20px rgba(255,150,200,.4));
  white-space:nowrap;
  transform:scale(.8);margin-top:16px;
}
.final-blessing.vis{opacity:1;transform:scale(1)}
.page{display:none;width:100%;height:100%}
.page.active{display:flex}
.audio-btn{position:fixed;top:18px;right:24px;z-index:1000;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s}
.audio-btn:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>

<!-- ===== 序幕 ===== -->
<div id="intro">
  <video id="introVideo" muted loop playsinline></video>
  <canvas id="meteorCvs" style="display:none"></canvas>
  <div class="intro-ui" id="introUI">
    <div class="reveal-line line1" id="line1"></div>
    <div class="reveal-line line2" id="line2"></div>
    <h2>今天是农历</h2>
    <p>请输入四位密码以继续</p>
    <div class="pwd-wrap">
      <input id="pwdIn" type="text" maxlength="4" placeholder="- - - -" inputmode="numeric" autocomplete="off">
      <button id="enterBtn">进入</button>
      <div id="errMsg">密码错误，请重试</div>
    </div>
  </div>
</div>

<!-- ===== 生日揭晓页 ===== -->
<div id="revealPage">
  <canvas id="revealCvs"></canvas>
  <div class="reveal-content">
    <div class="reveal-text" id="revealText">今天是这个小女孩的生日</div>
    <div class="reveal-arrow" id="revealArrow">⬇</div>
    <img class="reveal-photo" id="revealPhoto" src="girl.jpg" alt="生日主角">
    <button class="reveal-next-btn" id="revealNextBtn">进 入 下 一 页</button>
  </div>
</div>

<!-- ===== 回顾页 ===== -->
<div id="memoryPage">
  <canvas id="memCvs"></canvas>
  <div class="mem-text" id="memText">每一年的你，逐渐组成了现在的你</div>
  <button class="mem-review-btn" id="memReviewBtn">点 击 回 顾</button>
  <div class="mem-photo-area" id="memPhotoArea"></div>
  <div class="mem-final-text" id="memFinalText">S小姐，每一天的你都是绚烂的</div>
</div>

<!-- ===== 主站 ===== -->
<div id="mainSite">
  <button class="audio-btn" id="audioBtn" title="音乐开关">♪</button>
  <canvas id="fwCvs"></canvas>
  <div class="page active" id="page-home">
    <div class="content">
      <div class="char-bounce" id="char-liu">刘</div>
      <div class="char-bounce" id="char-shuang">爽</div>
      <div class="title"><span>生</span><span>日</span><span>快</span><span>乐</span></div>
      <button class="mystery-btn" id="mysteryBtn">进 入 神 秘 仪 式</button>
    </div>
  </div>
</div>

function bezier(t,p0,p1,p2,p3){var u=1-t;return u*u*u*p0+3*u*u*t*p1+3*u*t*t*p2+t*t*t*p3;}
var comet={t:0,speed:.0008,tailLen:500,alive:true};

function canvasLoop(){
  if(introDone||useVideo)return;

  if(comet.alive){
    comet.t+=comet.speed;if(comet.t>1.05)comet.alive=false;
    var cx=bezier(comet.t,-.15*iW,.25*iW,.75*iW,1.15*iW);
    var cy=bezier(comet.t,.15*iH,.05*iH,.95*iH,.85*iH);
    cometTrail.push({x:cx,y:cy,t:comet.t});if(cometTrail.length>comet.tailLen)cometTrail.shift();
    var layers=[{width:4,ab:.9,rf:function(p){return 100+p*155},gf:function(p){return 160-p*80},bf:function(p){return 255-p*30},step:2,mi:2},{width:10,ab:.25,rf:function(p){return 200+p*55},gf:function(p){return 100+p*40},bf:function(p){return 200-p*60},step:4,mi:4},{width:20,ab:.1,rf:function(){return 255},gf:function(p){return 180-p*60},bf:function(p){return 100+p*80},step:6,mi:6}];
    for(var li=0;li<layers.length;li++){var L=layers[li];for(var ci=cometTrail.length-1;ci>=L.mi;ci-=L.step){var prog=ci/cometTrail.length;var pt=cometTrail[ci],pt2=cometTrail[ci-L.step];var ta=(1-prog)*L.ab;introCtx.beginPath();introCtx.moveTo(pt2.x,pt2.y);introCtx.lineTo(pt.x,pt.y);introCtx.strokeStyle='rgba('+L.rf(prog)+','+L.gf(prog)+','+L.bf(prog)+','+ta.toFixed(3)+')';introCtx.lineWidth=Math.max(.5,(1-prog)*L.width);introCtx.stroke();}}
    var g1=introCtx.createRadialGradient(cx,cy,0,cx,cy,60);g1.addColorStop(0,'rgba(180,210,255,.4)');g1.addColorStop(1,'rgba(100,140,255,0)');introCtx.beginPath();introCtx.arc(cx,cy,60,0,Math.PI*2);introCtx.fillStyle=g1;introCtx.fill();
    var g2=introCtx.createRadialGradient(cx,cy,0,cx,cy,28);g2.addColorStop(0,'rgba(220,235,255,.8)');g2.addColorStop(1,'rgba(140,170,255,0)');introCtx.beginPath();introCtx.arc(cx,cy,28,0,Math.PI*2);introCtx.fillStyle=g2;introCtx.fill();
    introCtx.beginPath();introCtx.arc(cx,cy,4,0,Math.PI*2);introCtx.fillStyle='#fff';introCtx.fill();
    if(comet.t>.15&&comet.t<.85&&introFrame%8===0){
      var ta2=Math.PI/5+Math.random()*(Math.PI/7),sp2=.8+Math.random()*1.5;
      var tcs=['rgba(100,160,255,','rgba(180,120,255,','rgba(255,140,180,','rgba(255,180,120,'];
      iMeteors.push({x:cx+(Math.random()-.5)*40,y:cy+(Math.random()-.5)*40,vx:Math.cos(ta2)*sp2,vy:Math.sin(ta2)*sp2,tailLen:120+Math.random()*200,angle:ta2,headColor:'#fff',trailBase:tcs[Math.floor(Math.random()*tcs.length)],life:0,maxLife:200+Math.random()*120,r:1+Math.random()*1.5});
    }
  }
  for(var fi=iMeteors.length-1;fi>=0;fi--){
    var fr=iMeteors[fi];fr.x+=fr.vx;fr.y+=fr.vy;fr.vy+=.003;fr.life++;
    var fi2=Math.min(fr.life/15,1),fo=Math.max(0,1-(fr.life-fr.maxLife+30)/30);var fa=fi2*fo;
    var ftx=fr.x-Math.cos(fr.angle)*fr.tailLen,fty=fr.y-Math.sin(fr.angle)*fr.tailLen;
    var fg=introCtx.createLinearGradient(ftx,fty,fr.x,fr.y);fg.addColorStop(0,fr.trailBase+'0)');fg.addColorStop(.4,fr.trailBase+(fa*.2).toFixed(2)+')');fg.addColorStop(1,fr.trailBase+(fa*.7).toFixed(2)+')');

    introCtx.globalAlpha=1;
    if(fr.life>fr.maxLife+30||fr.y>iH+50||fr.x>iW+50)iMeteors.splice(fi,1);
  }
  requestAnimationFrame(canvasLoop);
}

/* ---- S 形坐标（10张照片） ---- */
function calcSPositions(areaW,areaH){
  // S形路径（正确的S方向）:
  //   [0][1][2]     顶部横排（左→右）
  //   [3]           左侧竖下
  //      [4][5]     中间横排（左→右）
  //            [6]  右侧竖下
  //   [7][8][9]     底部横排（左→右）
  var pw=areaW*.26, ph=areaH*.16;
  var gap=areaW*.015;
  var sPath=[
    [0,0],[1,0],[2,0],   // 顶排
    [0,1],                 // 左竖
    [1,2],[2,2],           // 中排
    [2,3],                 // 右竖
    [0,4],[1,4],[2,4]      // 底排
  ];
  var positions=[];
  for(var i=0;i<sPath.length;i++){
    var col=sPath[i][0],row=sPath[i][1];
    positions.push({x:col*(pw+gap), y:row*(ph+gap), w:pw, h:ph});
  }
  var totalW=3*pw+2*gap, totalH=5*ph+4*gap;
  var offX=(areaW-totalW)/2, offY=(areaH-totalH)/2;
  for(var i=0;i<positions.length;i++){
    positions[i].x+=offX;
    positions[i].y+=offY;
  }
  return positions;
}

/* ---- 照片播放流程 ---- */
var photoArea=document.getElementById('memPhotoArea');
var photoEls=[];
var currentPhoto=0;
var photoPhase='idle'; // idle, showing, s-forming, done

function startPhotoShow(){
  if(photoPhase!=='idle')return;
  photoPhase='showing';
  currentPhoto=0;
  document.getElementById('memReviewBtn').style.display='none';
  showNextPhoto();

function showNextPhoto(){
  if(currentPhoto>=memPhotos.length){
    photoPhase='s-forming';
    formS();
    return;
  }
  var idx=currentPhoto;
  var img=document.createElement('img');
  img.className='mem-photo-single';
  img.style.width='min(700px,78vw)';
  img.style.height='min(500px,62vh)';
  img.style.borderRadius='14px';

  // 尝试加载真实照片，失败则用渐变色块占位
  img.onerror=function(){
    img.style.background=memPhotoColors[idx];
    img.style.display='flex';img.style.alignItems='center';img.style.justifyContent='center';
    img.style.fontSize='20px';img.style.color='rgba(255,255,255,.5)';
    img.alt='照片 '+(idx+1);
  };
  img.src=memPhotos[idx];
  img.alt='照片 '+(idx+1);
  photoArea.appendChild(img);
  photoEls.push(img);

  // 淡入放大
  setTimeout(function(){img.classList.add('show');},50);

  // 2秒后缩小淡出，进入下一张
  setTimeout(function(){
    img.classList.remove('show');
    img.classList.add('shrink');
    img.style.transform='translate(-50%,-50%) scale(0)';
    img.style.opacity='0';
    setTimeout(function(){
      if(img.parentNode)img.parentNode.removeChild(img);
      currentPhoto++;
      showNextPhoto();
    },600);
  },2200);
}

/* ---- 拼成 S ---- */
function formS(){
  var areaRect=photoArea.getBoundingClientRect();
  var areaW=areaRect.width,areaH=areaRect.height;
  var sPos=calcSPositions(areaW,areaH);

  // 清空照片区，创建最终S形照片
  photoArea.innerHTML='';
  photoEls=[];

  for(var i=0;i<10;i++){
    var img=document.createElement('img');
    img.className='mem-photo-s';
    img.style.width=sPos[i].w+'px';
    img.style.height=sPos[i].h+'px';
    img.style.opacity='0';
    img.style.transform='scale(0)';

    (function(img,idx){
      img.onerror=function(){
        img.style.background=memPhotoColors[idx];
        img.style.display='flex';img.style.alignItems='center';img.style.justifyContent='center';
        img.style.fontSize='14px';img.style.color='rgba(255,255,255,.4)';
        img.alt='照片 '+(idx+1);
      };
    })(img,i);
    img.src=memPhotos[i];
    img.alt='照片 '+(i+1);
    photoArea.appendChild(img);
    photoEls.push(img);

    // 依次飞入
    (function(img,pos,delay){
      setTimeout(function(){
        img.style.left=pos.x+'px';
        img.style.top=pos.y+'px';
        img.style.opacity='1';
        img.style.transform='scale(1)';
      },delay);
    })(img,sPos[i],i*150);
  }

  // S形完成后5秒弹出字幕，再3秒自动进入首页
  var sFormDelay=10*150+800;
  setTimeout(function(){
    var ft=document.getElementById('memFinalText');
    ft.classList.add('vis');
    setTimeout(function(){
      memActive=false;
      memoryPageEl.classList.add('hide');
      setTimeout(function(){
        memoryPageEl.style.display='none';
        document.getElementById('mainSite').classList.add('on');
        bootMainSite();
      },1500);
    },3000);
  },sFormDelay);
}

introMusicBtn.addEventListener('click',function(e){e.stopPropagation();playMusic();introMusicBtn.style.display='none';});
audioBtn.addEventListener('click',function(){if(musicOn){bgMusic.pause();audioBtn.textContent='♪';}else{bgMusic.play().catch(function(){});audioBtn.textContent='♫';}musicOn=!musicOn;});

/* ==========================================================
   主站
   ========================================================== */
function bootMainSite(){
  audioBtn.textContent=musicOn?'♫':'♪';

  var fwCvs=document.getElementById('fwCvs'),fwCtx=fwCvs.getContext('2d');
  var fW,fH;
  function fwResize(){fW=fwCvs.width=window.innerWidth;fH=fwCvs.height=window.innerHeight;}
  fwResize();window.addEventListener('resize',fwResize);
  var fwParts=[];
  var fwColors=['#ff4d6a','#ffb84d','#4dff91','#4dc8ff','#c24dff','#ff4daa','#fff','#ffe066'];
  function fwBurst(x,y){var c=fwColors[Math.floor(Math.random()*fwColors.length)];for(var i=0;i<80;i++)fwParts.push({x:x,y:y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-2,a:1,c:c,r:Math.random()*3+1,d:Math.random()*.02+.008});}
  var fwTimer=0;
  function fwLoop(){fwCtx.fillStyle='rgba(10,10,26,.15)';fwCtx.fillRect(0,0,fW,fH);fwTimer++;if(fwTimer>50+Math.random()*30){fwBurst(Math.random()*fW,Math.random()*fH*.6+fH*.1);fwTimer=0;}for(var i=fwParts.length-1;i>=0;i--){var p=fwParts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.a-=p.d;if(p.a<=0){fwParts.splice(i,1);continue;}fwCtx.globalAlpha=p.a;fwCtx.beginPath();fwCtx.arc(p.x,p.y,p.r,0,Math.PI*2);fwCtx.fillStyle=p.c;fwCtx.fill();}fwCtx.globalAlpha=1;requestAnimationFrame(fwLoop);}
  fwLoop();
  fwCvs.addEventListener('click',function(e){fwBurst(e.clientX,e.clientY);});

  var cLiu=document.getElementById('char-liu'),cShuang=document.getElementById('char-shuang');
  var sTime=5000,sStart=performance.now();
  var liu={el:cLiu,x:Math.random()*(innerWidth-160)+30,y:Math.random()*(innerHeight-180)+30,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,rot:(Math.random()-.5)*40,vr:(Math.random()-.5)*6,done:false};
  var shuang={el:cShuang,x:Math.random()*(innerWidth-160)+30,y:Math.random()*(innerHeight-180)+30,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,rot:(Math.random()-.5)*40,vr:(Math.random()-.5)*6,done:false};
  cLiu.classList.add('bouncing');cShuang.classList.add('bouncing');
  function posC(c){c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';c.el.style.transform='rotate('+c.rot+'deg)';}
  posC(liu);posC(shuang);
  function bounceC(c,el){var pr=Math.min(el/sTime,1),ez=1-Math.pow(1-pr,3),sm=Math.max(.05,1-ez);c.x+=c.vx*sm;c.y+=c.vy*sm;c.rot+=c.vr*sm;var w=c.el.offsetWidth||160,h=c.el.offsetHeight||160;if(c.x<=0){c.x=0;c.vx*=-1;}if(c.x+w>=innerWidth){c.x=innerWidth-w;c.vx*=-1;}if(c.y<=60){c.y=60;c.vy*=-1;}if(c.y+h>=innerHeight){c.y=innerHeight-h;c.vy*=-1;}if(Math.random()<.03){c.vx+=(Math.random()-.5)*3;c.vy+=(Math.random()-.5)*3;c.vr+=(Math.random()-.5)*2;}c.vx=Math.max(-12,Math.min(12,c.vx));c.vy=Math.max(-12,Math.min(12,c.vy));c.vr=Math.max(-8,Math.min(8,c.vr));}
  function settleC(c,fx,fy){c.done=true;c.el.classList.remove('bouncing');c.el.classList.add('settled');c.el.style.left=fx+'px';c.el.style.top=fy+'px';c.el.style.transform='rotate(0deg)';}
  function animChars(ts){var el=ts-sStart;if(!liu.done)bounceC(liu,el);if(!shuang.done)bounceC(shuang,el);if(!liu.done)posC(liu);if(!shuang.done)posC(shuang);if(el>=sTime&&(!liu.done||!shuang.done)){var title=document.querySelector('.title'),rect=title.getBoundingClientRect();var cx=rect.left+rect.width/2,top=rect.top,gap=16;var lw=liu.el.offsetWidth||160,sw=shuang.el.offsetWidth||160;settleC(liu,cx-(lw+gap+sw)/2,top-(liu.el.offsetHeight||160)-10);settleC(shuang,cx-(lw+gap+sw)/2+lw+gap,top-(liu.el.offsetHeight||160)-10);}if(!liu.done||!shuang.done)requestAnimationFrame(animChars);}
  requestAnimationFrame(animChars);
}

/* ==========================================================
   神秘仪式 — 蛋糕点蜡烛 → 许愿 → 吹蜡烛 → 祝福
   ========================================================== */
var cakeEl=document.getElementById('cakeCeremony');
var cakeCvs=document.getElementById('cakeCvs');
var cakeCtx=cakeCvs.getContext('2d');

// 蜡烛位置（6根，分布在蛋糕顶部）
var flames=[];
var candlesLit=0;
var matchEl=null;

document.getElementById('mysteryBtn').addEventListener('click',function(){
  cakeEl.classList.add('show');
  cakeCvs.width=window.innerWidth;cakeCvs.height=window.innerHeight;
  cakeStarLoop();
  startCakeCeremony();
});

function startCakeCeremony(){
  var candleArea=document.getElementById('candleArea');
  
  // 6根蜡烛均匀分布在蛋糕顶部（上方空白区）
  var positions=[30,38,46,54,62,70];
  for(var i=0;i<positions.length;i++){
    var c=document.createElement('div');
    c.className='candle';
    c.style.left=positions[i]+'%';
    c.style.top='6%';
    c.innerHTML='<div class="candle-stripe" style="top:12px"></div><div class="candle-stripe" style="top:30px"></div><div class="flame-glow" id="glow'+i+'"></div><div class="flame" id="flame'+i+'"></div>';
    candleArea.appendChild(c);
    flames.push({lit:false,el:c});
  }

  // 天上掉落小蛋糕emoji
  var cakeEmojis=['🎂','🍰','🧁','🎉','🎀','⭐','💖','🍓'];
  var fallTimer=0;
  function spawnFallingCake(){
    if(cakeEl.style.display==='none')return;
    fallTimer++;
    if(fallTimer%18===0){
      var el=document.createElement('div');
      el.className='falling-cake-emoji';
      el.textContent=cakeEmojis[Math.floor(Math.random()*cakeEmojis.length)];
      el.style.left=(5+Math.random()*90)+'%';
      el.style.fontSize=(28+Math.random()*20)+'px';
      var dur=4+Math.random()*4;
      el.style.animationDuration=dur+'s';
      cakeEl.appendChild(el);
      setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},dur*1000+200);
    }
    requestAnimationFrame(spawnFallingCake);
  }
  spawnFallingCake();

  setTimeout(function(){showMatch();},3000);
}

function showMatch(){
  // 创建火柴
  matchEl=document.createElement('div');
  matchEl.className='match';
  matchEl.innerHTML='<div class="match-head"></div>';
  matchEl.style.left=(innerWidth/2-3)+'px';
  matchEl.style.top=(innerHeight/2-100)+'px';
  cakeEl.appendChild(matchEl);
  matchEl.style.opacity='1';

  // 火柴点燃动画：从底部移动到每根蜡烛位置
  var candleArea=document.getElementById('candleArea');
  var areaRect=candleArea.getBoundingClientRect();
  var candlePos=[30,38,46,54,62,70];
  var delay=0;
  for(var i=0;i<candlePos.length;i++){
    (function(idx){
      setTimeout(function(){
        var cx=areaRect.left+areaRect.width*(candlePos[idx]/100);
        var cy=areaRect.top+areaRect.height*0.06;
        matchEl.style.transition='left .3s ease,top .3s ease';
        matchEl.style.left=cx+'px';
        matchEl.style.top=cy+'px';
        matchEl.classList.add('lit');
        setTimeout(function(){
          document.getElementById('flame'+idx).classList.add('lit');
          document.getElementById('glow'+idx).classList.add('lit');
        },200);
      },delay);
      delay+=400;
    })(i);
  }

  // 点完后火柴消失
  setTimeout(function(){
    matchEl.style.opacity='0';
    setTimeout(function(){if(matchEl&&matchEl.parentNode)matchEl.parentNode.removeChild(matchEl);},400);
    // 出现"请小姐闭眼许愿"
    setTimeout(function(){
      document.getElementById('cakeWishText').classList.add('vis');
      // 出现许愿按钮
      setTimeout(function(){
        document.getElementById('wishBtn').classList.add('vis');
      },1500);
    },800);
  },delay+400);
}

// 许愿按钮
document.getElementById('wishBtn').addEventListener('click',function(){
  this.classList.remove('vis');
  document.getElementById('cakeWishText').classList.remove('vis');
  // 5秒后出吹蜡烛提示
  setTimeout(function(){
    document.getElementById('cakeBlowText').classList.add('vis');
    setTimeout(function(){
      document.getElementById('blowBtn').classList.add('vis');
    },1500);
  },5000);
});

// 吹蜡烛按钮
document.getElementById('blowBtn').addEventListener('click',function(){
  this.classList.remove('vis');
  document.getElementById('cakeBlowText').classList.remove('vis');
  blowCandles();
});

function blowCandles(){
  // 大风横扫效果
  var sweep=document.createElement('div');
  sweep.className='wind-sweep';
  cakeEl.appendChild(sweep);
  setTimeout(function(){sweep.classList.add('blowing');},50);
  setTimeout(function(){if(sweep.parentNode)sweep.parentNode.removeChild(sweep);},1500);

  // 风粒子
  for(var w=0;w<15;w++){
    (function(delay){
      var part=document.createElement('div');
      part.className='wind-particle';
      part.style.left='0px';
      part.style.top=(innerHeight/2-100+Math.random()*200)+'px';
      part.style.animationDelay=delay+'ms';
      cakeEl.appendChild(part);
      setTimeout(function(){part.classList.add('blowing');},delay);
      setTimeout(function(){if(part.parentNode)part.parentNode.removeChild(part);},delay+1000);
    })(w*80);
  }

  // 依次吹灭蜡烛（17根）
  var blowDelay=600;
  for(var i=0;i<6;i++){
    (function(idx){
      setTimeout(function(){
        document.getElementById('flame'+idx).classList.remove('lit');
        document.getElementById('glow'+idx).classList.remove('lit');
      },blowDelay+idx*200);
    })(i);
  }

  // 全灭后弹出最终祝福
  setTimeout(function(){
    document.getElementById('finalBlessing').classList.add('vis');
    // 4秒后自动关闭仪式回到首页
    setTimeout(function(){
      cakeEl.classList.add('hide');
      setTimeout(function(){
        cakeEl.style.display='none';
      },1500);
    },5000);
  },blowDelay+6*200+500);
}

/* 蛋糕页背景星辰 */
var cakeStars=[];
function cakeStarLoop(){
  if(cakeEl.style.display==='none')return;
  cakeCvs.width=cakeCvs.width;
  cakeCtx.fillStyle='#0a0520';cakeCtx.fillRect(0,0,cakeCvs.width,cakeCvs.height);
  if(cakeStars.length===0){
    for(var i=0;i<120;i++)cakeStars.push({x:Math.random()*cakeCvs.width,y:Math.random()*cakeCvs.height,r:Math.random()*.8+.2,ph:Math.random()*Math.PI*2,sp:Math.random()*.01+.003});
  }
  for(var i=0;i<cakeStars.length;i++){
    var s=cakeStars[i];s.ph+=s.sp;
    cakeCtx.beginPath();cakeCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    cakeCtx.fillStyle='rgba(160,170,255,'+(0.3+Math.sin(s.ph)*.3)+')';cakeCtx.fill();
  }
  requestAnimationFrame(cakeStarLoop);
}
</script>
